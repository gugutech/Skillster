<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skillster | Life achievements</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#161a17;--panel:#212922;--panel2:#2c352d;--line:#4c5b46;--text:#f0f0d8;--muted:#aab69f;--gold:#e5c46a;--green:#9bc56a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;height:100dvh;background:var(--bg);color:var(--text);font-family:'Pixelify Sans',ui-monospace,Consolas,monospace;font-size:15px;background-image:linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px);background-size:24px 24px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;background:#202720;border-bottom:4px solid #0e120f;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:22px;letter-spacing:1px}
.logo{width:30px;height:30px;background:linear-gradient(135deg,#9bc56a 0 45%,#5e8d43 45%);border:3px solid #c5d49c;box-shadow:inset -5px -5px #38572f}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:transparent;border:2px solid transparent;padding:8px 12px}
nav button:hover,nav button.on{background:#354334;border-color:#657e59}
.lvl{display:flex;align-items:center;gap:10px;font-size:14px}
.lvl b{color:var(--gold)}
.hbar{width:130px;height:12px;background:#0f140f;border:2px solid #53624b}
.hbar i,.pbar i{display:block;height:100%;width:0;background:var(--green)}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;overflow:auto}
.view.on{display:block}
#v-map.on{display:flex;flex-direction:column;overflow:hidden}
#tabs{display:flex;overflow-x:auto;background:#242c25;border-bottom:3px solid #101510;flex:none}
#tabs button{flex:none;background:#2c352d;border:2px solid #3d4a3a;border-bottom:0;margin:6px 0 0 6px;padding:7px 12px;white-space:nowrap}
#tabs button small{color:var(--muted);margin-left:6px}
#tabs button.on{background:#4c6e3e;border-color:#a2c879}
#canvas{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none;background:#1b211c radial-gradient(#364333 1px,transparent 1px) 0 0/24px 24px}
#canvas:active{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world svg{position:absolute;left:0;top:0;pointer-events:none}
#world path{fill:none;stroke:#4d584a;stroke-width:5}
#world path.half{stroke:#d4b75e}
#world path.on{stroke:var(--green)}
#world path.x{stroke-dasharray:8 6}
.node{position:absolute;width:76px;height:76px;background:none;border:0;padding:0}
.box{display:grid;place-items:center;width:76px;height:76px;border:4px solid;font-size:32px;position:relative;transition:transform .1s}
.node:hover .box{transform:translateY(-3px)}
.box:after{content:"";position:absolute;right:3px;top:3px;width:9px;height:9px;background:var(--rc)}
.node.locked .box{background:#394239;border-color:#5b6554;box-shadow:inset -6px -6px #242d25,inset 5px 5px #4a5446}
.node.locked .box i{filter:grayscale(1);opacity:.55}
.node.avail .box{background:#665b36;border-color:#d4b75e;box-shadow:inset -6px -6px #403b27,inset 5px 5px #8a7847}
.node.done .box{background:#4c6e3e;border-color:#a2c879;box-shadow:inset -6px -6px #35512d,inset 5px 5px #70965a}
.node.done .box:before{content:"✔";position:absolute;right:4px;bottom:0;font-size:14px;font-style:normal;color:#e8f6cc}
.node.secret .box{border-style:dashed}
.node.sel .box{outline:3px solid #fff;outline-offset:3px}
.node.hit .box{animation:hit .8s 3}
@keyframes hit{50%{transform:scale(1.18)}}
.box i{font-style:normal}
.lbl{position:absolute;top:82px;left:-37px;width:150px;text-align:center;font-size:13px;line-height:1.15;color:#dfe8d2}
.node.locked .lbl{color:#97a38d}
.tools{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
.tools button,.search{background:#303a30;border:2px solid #65765b;padding:8px 11px}
.tools button:hover{background:#3c4b38}
.search{position:absolute;right:10px;top:10px;width:min(230px,55vw)}
.legend{position:absolute;right:10px;bottom:10px;background:#293229cc;border:2px solid #485744;padding:7px 10px;font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border:2px solid;margin-right:5px;vertical-align:-1px}
.legend .l1:before{border-color:#5b6554;background:#394239}.legend .l2:before{border-color:#d4b75e;background:#665b36}.legend .l3:before{border-color:#a2c879;background:#4c6e3e}
.page{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:0 0 6px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
.panel{background:var(--panel);border:3px solid var(--line);padding:16px;margin-bottom:16px}
.btn{background:#73994f;border:3px solid #b2d18b;color:#10170d;font-weight:600;padding:11px 16px}
.btn:hover{background:#82a95d}
.btn:disabled{background:#465b3c;color:#cfe0c3;border-color:#718363;cursor:default}
.btn.gray{background:#5c6658;border-color:#8c9886;color:var(--text)}
.btn.gray:hover{background:#6a7566}
.btn.dark{background:#3a3f38;border-color:#6c7466;color:var(--text)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px}
.tag{display:inline-block;font-size:12px;padding:4px 8px;background:#3d4b3d;border:1px solid #718363;margin:0 6px 6px 0}
#det{position:fixed;right:16px;bottom:16px;width:min(350px,calc(100vw - 32px));background:#283229;border:4px solid #718363;box-shadow:8px 8px #0c100d;z-index:20;padding:16px;display:none;max-height:calc(100dvh - 90px);overflow:auto}
#det.on{display:block}
.dtop{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
#dx{background:#465443;border:2px solid #829475;padding:2px 9px}
.dic{font-size:38px;margin:10px 0 2px}
#det h2{font-size:21px;margin:0 0 6px;font-weight:600}
#det p{margin:0 0 10px;line-height:1.45;color:#ccd7c2}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;color:var(--muted)}
#det .btn{width:100%}
#pop{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:50}
#pop.on{display:grid}
.pbox{width:min(400px,92vw);background:#283229;border:4px solid #b2d18b;box-shadow:8px 8px #0c100d;padding:22px;text-align:center;animation:pin .22s steps(4)}
@keyframes pin{from{transform:scale(.8)}}
.ptag{color:var(--gold);font-size:14px;margin-bottom:10px}
.picon{display:inline-grid;place-items:center;width:84px;height:84px;font-size:44px;background:#4c6e3e;border:4px solid #a2c879;box-shadow:inset -6px -6px #35512d,inset 5px 5px #70965a}
.pbox h2{margin:14px 0 6px;font-size:24px;font-weight:600}
.pbox p{margin:0 0 12px;color:#ccd7c2;line-height:1.4}
.pmeta{display:flex;gap:10px;justify-content:center;margin-bottom:14px;font-size:14px}
.pbar{height:16px;background:#0f140f;border:2px solid #53624b;margin-bottom:6px}
#pl{font-size:14px;color:var(--muted);margin-bottom:14px;min-height:20px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
#toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:#d7c16e;color:#202016;border:3px solid #f0dc91;padding:9px 14px;font-weight:600;display:none;z-index:70;box-shadow:5px 5px #0c100d}
#toast.on{display:block}
.qc{text-align:center}
.qcbox{display:inline-grid;place-items:center;width:110px;height:110px;font-size:58px;border:4px solid #d4b75e;background:#665b36;box-shadow:inset -8px -8px #403b27,inset 6px 6px #8a7847;margin:8px 0}
.qc h2{font-size:28px;margin:8px 0;font-weight:600}
.qc p.d{font-size:17px;max-width:520px;margin:0 auto 12px;line-height:1.45}
.qcq{font-size:20px;margin:20px 0 14px;color:var(--gold)}
.qcb{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.qcb .btn{min-width:130px;font-size:17px}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.ev{display:flex;gap:12px}
.av{flex:none;width:44px;height:44px;display:grid;place-items:center;font-weight:600;font-size:20px;color:#1a1a14;border:3px solid #0003;box-shadow:inset -5px -5px #0003}
.ev .b{flex:1;min-width:0}
.rx{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 6px}
.rx button{background:#303a30;border:2px solid #55664d;padding:3px 9px}
.rx button.me{background:#4c6e3e;border-color:#a2c879}
.cm{font-size:14px;color:#ccd7c2;margin:4px 0}
.cmrow{display:flex;gap:6px;margin-top:6px}
.cmrow input,.in{flex:1;min-width:0;background:#141a15;border:2px solid #55664d;padding:7px 9px}
.fr{display:flex;align-items:center;gap:10px;width:100%;background:none;border:2px solid transparent;padding:6px;text-align:left}
.fr:hover{background:#354334;border-color:#657e59}
.goal{margin-bottom:14px;font-size:14px}
.skill{display:grid;grid-template-columns:130px 1fr 50px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.skill .pbar{margin:0}
#modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:40;padding:12px}
#modal.on{display:grid}
#modal .panel{width:min(440px,100%);margin:0;max-height:90dvh;overflow:auto}
.hl{color:var(--gold)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:10px}
.qcard{background:#283229;border:3px solid #4c5b46;padding:12px;display:flex;flex-direction:column;gap:6px}
.qcard h3{margin:0;font-size:15px;font-weight:600}
.qcard .d{font-size:13px;color:#ccd7c2;flex:1}
.qcard .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px}
.qcard .act{display:flex;gap:6px;margin-top:6px}
.qcard .act .btn,.qcard .act .link{flex:1;text-align:center;padding:8px 6px;font-size:13px}
.qtimer{font-size:11px;color:var(--muted)}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.sitem{background:#283229;border:3px solid #4c5b46;padding:10px;text-align:center;cursor:pointer}
.sitem:hover{border-color:#8aa97e}
.sitem .ic{font-size:30px;margin-bottom:4px}
.sitem .nm{font-size:13px;font-weight:600}
.sitem .pr{font-size:12px;color:var(--gold);margin-top:4px}
.sitem.owned{border-color:#a2c879}
.sitem.eq{border-color:#e5c46a;box-shadow:inset 0 0 0 2px #e5c46a55}
.faq details{border:2px solid #3d4a3a;margin-bottom:6px;padding:8px 10px;background:#232c23}
.faq summary{cursor:pointer;font-weight:600}
.faq p{margin:8px 0 0;color:#ccd7c2;font-size:13px}
select.in{appearance:none}
.plate{padding:2px 8px;display:inline-block;border:1px solid #0003}
.plate-wood{background:#6b4a2d;color:#f2e4c8}
.plate-chrome{background:linear-gradient(90deg,#aab3bd,#e7ecf2);color:#1a1a1a}
.av.frame-gold{box-shadow:0 0 0 3px #e5c46a,inset -5px -5px #0003}
.av.frame-vine{box-shadow:0 0 0 3px #6fcf7f,inset -5px -5px #0003}
.av.frame-neon{box-shadow:0 0 0 3px #5ef0ff,0 0 8px #5ef0ff,inset -5px -5px #0003}
body[data-theme="ember"]{--green:#e0793f;--gold:#f2a65a}
body[data-theme="glacier"]{--green:#6fb8d9;--gold:#bfe3ef}
body[data-theme="royal"]{--green:#b081e0;--gold:#e6b8ff}
body[data-skin="neon"] .node.done .box{border-color:#5ef0ff;box-shadow:inset -6px -6px #063036,inset 5px 5px #0f4850,0 0 10px #5ef0ff99;background:#0b2a30}
body[data-skin="royal"] .node.done .box{border-color:#d9a6ff;box-shadow:inset -6px -6px #2a1540,inset 5px 5px #4a2a66,0 0 10px #d9a6ff88;background:#241036}
body.bg-sunset #canvas{background-image:linear-gradient(180deg,#3a2a1fcc,transparent 40%),radial-gradient(#364333 1px,transparent 1px);background-size:auto,24px 24px}
body.bg-circuit #canvas{background-image:linear-gradient(#2a332a99 1px,transparent 1px),linear-gradient(90deg,#2a332a99 1px,transparent 1px),radial-gradient(#364333 1px,transparent 1px);background-size:48px 48px,48px 48px,24px 24px}
body.bg-aurora #canvas{background-image:linear-gradient(120deg,#1b3a2fbb,#1b213abb,transparent),radial-gradient(#364333 1px,transparent 1px);background-size:auto,24px 24px}
@media(max-width:760px){.cols{grid-template-columns:1fr}.legend{display:none}.hbar{width:80px}.brand{font-size:19px}.skill{grid-template-columns:100px 1fr 44px}#det{right:8px;left:8px;bottom:8px;width:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo"></span>SKILLSTER</div>
  <nav id="nav"><button data-v="map">Map</button><button data-v="qc">Quick Check</button><button data-v="quests">Quests</button><button data-v="shop">Shop</button><button data-v="feed">Feed</button><button data-v="me">Profile</button></nav>
  <div class="lvl"><b id="lv">Lv 1</b><div class="hbar"><i id="hb"></i></div><span id="hx">0 XP</span><span id="hc">🪙 0</span></div>
</header>
<main>
  <section class="view" id="v-map">
    <div id="tabs"></div>
    <div id="canvas">
      <div id="world"></div>
      <input class="search" id="q" placeholder="Search achievements, press Enter" aria-label="Search achievements">
      <div class="tools"><button id="zi" title="Zoom in">+</button><button id="zo" title="Zoom out">−</button><button id="zf">Fit</button><button id="zn">Next up</button></div>
      <div class="legend"><span class="l1">Locked</span><span class="l2">Ready</span><span class="l3">Done</span><span>Dashed line: extra prerequisite</span></div>
    </div>
  </section>
  <section class="view" id="v-qc"><div class="page" id="qcp"></div></section>
  <section class="view" id="v-quests"><div class="page" id="qp"></div></section>
  <section class="view" id="v-shop"><div class="page" id="sp"></div></section>
  <section class="view" id="v-feed"><div class="page" id="fp"></div></section>
  <section class="view" id="v-me"><div class="page" id="mp"></div></section>
</main>
<aside id="det" aria-live="polite">
  <div class="dtop"><span id="dcat"></span><button id="dx" aria-label="Close">✕</button></div>
  <div class="dic" id="dic"></div><h2 id="dt"></h2><p id="dd"></p>
  <div id="dtags"></div><p class="small" id="dpre"></p>
  <button class="btn" id="ddo"></button>
  <label class="chk"><input type="checkbox" id="dpv"> Keep this one private (hidden from the feed)</label>
  <button class="link" id="dundo">Take it back</button>
</aside>
<div id="pop"><div class="pbox">
  <div class="ptag">Achievement unlocked</div><div class="picon" id="pi"></div>
  <h2 id="pt"></h2><p id="pd"></p>
  <div class="pmeta"><span class="tag" id="pr"></span><span class="tag" id="px"></span></div>
  <div class="pbar"><i id="pf"></i></div><div id="pl"></div>
  <button class="btn" id="pok">Continue</button>
</div></div>
<div id="modal"><div class="panel" id="mbox"></div></div>
<div id="toast"></div>
<canvas id="fx"></canvas>

<script>
/* ---------- DATA ---------- */
const RAR={C:{n:'Common',xp:10,coins:5,c:'#b9c2b0'},U:{n:'Uncommon',xp:25,coins:10,c:'#6fcf7f'},R:{n:'Rare',xp:50,coins:25,c:'#5fa8e8'},E:{n:'Epic',xp:100,coins:50,c:'#b57be8'},L:{n:'Legendary',xp:250,coins:100,c:'#f0b93a'}};
/* line format: id|title|icon|description|rarity(C U R E L)|parents (a+b)|flag (s = secret) */
const TABS=[

{id:'social',name:'Social',icon:'🧑‍🤝‍🧑',data:`

paper|Published|📰|Get your writing published.|E|degree
teach|Teacher Mode|🧑‍🏫|Teach someone a skill.|U|course
chess|Check and Mate|♟️|Win a game of chess.|C|read

museum|Culture Trip|🏛️|Visit a museum for fun.|C|read`},
{id:'creative',name:'Creative',icon:'🎨',data:`

function drawMap(){
  const t=TB[S.tab],[W,H]=bounds(t);let svg='',h='';
  t.nodes.forEach(n=>n.parents.forEach((p,i)=>{const P=BY[p],x2=n.x,y2=n.y+38;
    const cls=(S.done[p]&&S.done[n.id]?'on':S.done[p]?'half':'')+(i?' x':'');
    svg+=`<path class="${cls}" d="M${P.x+76} ${P.y+38}H${x2-47}V${y2}H${x2}"/>`}));
  t.nodes.forEach(n=>{const hd=hidden(n);
    h+=`<button class="node ${st(n)}${n.secret?' secret':''}${n.id===selId?' sel':''}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px;--rc:${RAR[n.r].c}" aria-label="${esc(hd?'Secret achievement':n.title)}"><span class="box"><i>${hd?'❓':n.icon}</i></span><span class="lbl">${hd?'???':esc(n.title)}</span></button>`});

function fit(){const [W,H]=bounds(TB[S.tab]),cw=cv.clientWidth,ch=cv.clientHeight;
  const s=Math.min(1,Math.max(.5,Math.min(cw/W,ch/H)));V.s=s;V.x=Math.max(10,(cw-W*s)/2);V.y=Math.max(10,(ch-H*s)/2);applyV()}
function centerOn(n){V.x=cv.clientWidth/2-(n.x+38)*V.s;V.y=cv.clientHeight/2-(n.y+38)*V.s;applyV()}
function zoomAt(f,cx,cy){const ns=Math.min(1.6,Math.max(.3,V.s*f)),k=ns/V.s;V.x=cx-(cx-V.x)*k;V.y=cy-(cy-V.y)*k;V.s=ns;applyV()}
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(e.deltaY<0?1.1:.9,e.clientX-r.left,e.clientY-r.top)},{passive:false});
const P=new Map();let moved=0,pd=0;

  if(P.size==1){V.x+=dx;V.y+=dy;moved+=Math.abs(dx)+Math.abs(dy);applyV()}
  else if(P.size==2){const d=pdist(),a=[...P.values()],r=cv.getBoundingClientRect();if(pd)zoomAt(d/pd,(a[0].x+a[1].x)/2-r.left,(a[0].y+a[1].y)/2-r.top);pd=d;moved+=9}});

/* ---------- UNLOCK + FX ---------- */
function unlock(id){
  const a=BY[id];if(S.done[id])return false;const old=totalXP();
  S.done[id]=Date.now();S.ny=S.ny.filter(x=>x!==id);S.sk=S.sk.filter(x=>x!==id);
  const R=RAR[a.r];S.coins+=R.coins;
  const nw=totalXP();S.feed.unshift({a:id,t:Date.now()});
  if(lvOf(nw)>lvOf(old))S.feed.unshift({lv:lvOf(nw),t:Date.now()});
  save();queuePop({icon:a.icon,title:a.title,desc:a.desc,xp:a.xp,coins:R.coins,rc:R.c,rn:R.n},old,nw);checkMilestones();refresh();return true;
}
const PQ=[];let popOpen=false,popTimer;
function queuePop(a,old,nw){PQ.push({a,old,nw});if(!popOpen)nextPop()}
function nextPop(){
  const q=PQ.shift();if(!q){popOpen=false;$('#pop').classList.remove('on');return}
  popOpen=true;const a=q.a,col=a.rc||'#9bc56a',L0=lvOf(q.old),L1=lvOf(q.nw),f=$('#pf');
  $('#pi').textContent=a.icon;$('#pt').textContent=a.title;$('#pd').textContent=a.desc;
  $('#pr').textContent=a.rn||'Quest';$('#pr').style.color=col;$('#px').textContent='+'+a.xp+' XP'+(a.coins?' · +'+a.coins+' 🪙':'');
  f.style.transition='none';f.style.width=frac(q.old,L0)+'%';$('#pl').textContent='Level '+L0;
  $('#pop').classList.add('on');
  const go=()=>{f.style.transition='width .9s steps(18)';
    if(L1>L0){f.style.width='100%';setTimeout(()=>{f.style.transition='none';f.style.width='0%';$('#pl').innerHTML='<span class="hl">Level up! Level '+L1+', '+titleOf(L1)+'</span>';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transition='width .9s steps(18)';f.style.width=frac(q.nw,L1)+'%'}))},1000)}
    else{f.style.width=frac(q.nw,L1)+'%';$('#pl').textContent='Level '+L1+', '+(cum(L1+1)-q.nw)+' XP to next'}
    const r=$('#pi').getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,col)};
  requestAnimationFrame(()=>requestAnimationFrame(go));
  clearTimeout(popTimer);popTimer=setTimeout(()=>$('#pok').click(),6500);
}
$('#pok').onclick=()=>{clearTimeout(popTimer);nextPop()};
const fx=$('#fx'),cx=fx.getContext('2d');let ps=[],raf=0;
const sizeFx=()=>{fx.width=innerWidth;fx.height=innerHeight};addEventListener('resize',sizeFx);sizeFx();
function burst(x,y,col){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  for(let i=0;i<40;i++){const an=Math.random()*6.283,sp=2+Math.random()*5;ps.push({x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-2,s:4+Math.floor(Math.random()*3)*3,l:1,c:Math.random()<.3?'#f0f0d8':col})}
  if(!raf)raf=requestAnimationFrame(tick)}
function tick(){cx.clearRect(0,0,fx.width,fx.height);ps=ps.filter(p=>p.l>0);
  ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.vx*=.98;p.l-=.018;cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;cx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s)});
  cx.globalAlpha=1;raf=ps.length?requestAnimationFrame(tick):0;if(!raf)cx.clearRect(0,0,fx.width,fx.height)}

/* ---------- QUICK CHECK ---------- */
let qcCur=null;
function qcPick(){
  let pool=A.filter(a=>!S.done[a.id]&&!S.ny.includes(a.id)&&!S.sk.includes(a.id));
  if(!pool.length){S.sk=[];pool=A.filter(a=>!S.done[a.id]&&!S.ny.includes(a.id))}
  if(!pool.length){S.ny=[];pool=A.filter(a=>!S.done[a.id])}
  if(pool.length>1&&qcCur)pool=pool.filter(a=>a.id!==qcCur.id);
  return pool.length?pool[Math.floor(Math.random()*pool.length)]:null}
function renderQC(newCard){
  if(newCard||!qcCur||S.done[qcCur.id])qcCur=qcPick();
  const a=qcCur,el=$('#qcp');
  const head=`<h1>Quick Check</h1><p class="muted">Cards come up in random order, prerequisites or not. You may have done things you never thought to log.</p>`;
  if(!a){el.innerHTML=head+'<div class="panel">You have unlocked every achievement. Add more to the list and come back.</div>';return}
  const R=RAR[a.r],locked=st(a)==='locked';
  el.innerHTML=head+`<div class="panel qc"><div class="small">${TB[a.tab].icon} ${TB[a.tab].name}${a.secret?' · Secret found':''}</div>
  <div class="qcbox">${a.icon}</div><h2>${esc(a.title)}</h2><p class="d">${esc(a.desc)}</p>
  <span class="tag" style="border-color:${R.c};color:${R.c}">${R.n}</span><span class="tag">+${a.xp} XP</span>${locked?'<span class="tag">Skips ahead of its prerequisites</span>':''}
  <div class="qcq">Have you done this?</div>
  <div class="qcb"><button class="btn" id="qy">Yes</button><button class="btn gray" id="qn">Not yet</button><button class="btn dark" id="qs">Skip</button></div>
  <p class="small" style="margin-top:16px">Not yet: shows up again last. Skip: comes back later. Keys: Y, N, S.<br>This session: ${S.qcY} unlocked from ${S.qcN} answered · ${A.filter(x=>!S.done[x.id]).length} left to discover</p></div>`;
  $('#qy').onclick=()=>qcAns('y');$('#qn').onclick=()=>qcAns('n');$('#qs').onclick=()=>qcAns('s');
}
function qcAns(k){
  const a=qcCur;if(!a)return;
  if(k==='y'){S.qcN++;S.qcY++;unlock(a.id)}
  else if(k==='n'){S.qcN++;if(!S.ny.includes(a.id))S.ny.push(a.id)}
  else if(!S.sk.includes(a.id))S.sk.push(a.id);
  save();renderQC(true);
}
addEventListener('keydown',e=>{if(S.view!=='qc'||e.target.tagName==='INPUT'||e.ctrlKey||e.metaKey||$('#pop').classList.contains('on'))return;
  const k={y:'y',n:'n',s:'s'}[e.key.toLowerCase()];if(k)qcAns(k)});

function defaultIdFor(cat){return cat==='theme'?'theme-default':cat==='skin'?'skin-default':cat+'-none'}

function applyCosmetics(){

  document.body.dataset.theme=(eq.theme||'theme-default').replace('theme-','');
  document.body.dataset.skin=(eq.skin||'skin-default').replace('skin-','');
  document.body.className=document.body.className.split(' ').filter(c=>!c.startsWith('bg-')).join(' ');
  if(eq.bg&&eq.bg!=='bg-none')document.body.classList.add(eq.bg);
}
function buyItem(id){const it=SHOP_BY[id];if(!it||S.shop.owned.includes(id))return;if(S.coins<it.price)return toast('Not enough coins');S.coins-=it.price;S.shop.owned.push(id);save();header();toast('Purchased '+it.name)}
function equipItem(id){const it=SHOP_BY[id];if(!it||!S.shop.owned.includes(id))return;S.shop.eq[it.cat]=id;save();applyCosmetics()}
function renderShop(){
  const el=$('#sp');
  el.innerHTML=`<h1>Shop</h1><p class="muted">Spend coins on cosmetics. Nothing here changes how the game plays, and nothing expires once bought.</p>
  <div class="panel" style="text-align:center"><b style="font-size:20px">🪙 ${S.coins}</b><div class="small">coins available</div></div>
  ${CATS_SHOP.map(([c,label])=>`<div class="panel"><b>${label}</b><div class="shopgrid">${SHOP.filter(i=>i.cat===c).map(i=>{
    const owned=S.shop.owned.includes(i.id),eq=S.shop.eq[c]===i.id;
    return`<div class="sitem ${owned?'owned':''} ${eq?'eq':''}" data-item="${i.id}"><div class="ic">${i.icon}</div><div class="nm">${esc(i.name)}</div><div class="pr">${eq?'Equipped':owned?'Owned':'🪙 '+i.price}</div></div>`}).join('')}</div></div>`).join('')}`;
}
function shopModal(id){
  const it=SHOP_BY[id],owned=S.shop.owned.includes(id),eq=S.shop.eq[it.cat]===id;
  $('#mbox').innerHTML=`<div style="text-align:center"><div style="font-size:54px">${it.icon}</div><h2 style="margin:10px 0 4px">${esc(it.name)}</h2><p class="small">${esc(it.desc)}</p>
  <p>${owned?'':'<span class="tag">🪙 '+it.price+'</span>'}</p>
  ${eq?'<button class="btn gray" disabled>Equipped</button>':owned?'<button class="btn" id="mbuy">Equip</button>':`<button class="btn" id="mbuy" ${S.coins<it.price?'disabled':''}>Buy for ${it.price} 🪙</button>`}
  <button class="btn dark" id="mc" style="margin-top:8px">Close</button></div>`;
  $('#modal').classList.add('on');$('#mc').onclick=()=>$('#modal').classList.remove('on');
  const b=$('#mbuy');if(b)b.onclick=()=>{owned?equipItem(id):buyItem(id);$('#modal').classList.remove('on');renderShop();if(S.view==='me')renderMe()};
}
$('#sp').addEventListener('click',e=>{const c=e.target.closest('[data-item]');if(c)shopModal(c.dataset.item)});

/* ---------- QUESTS ---------- */
function topTag(){const c={};A.filter(isDone).forEach(a=>c[a.tab]=(c[a.tab]||0)+1);const ks=Object.keys(c);if(!ks.length)return null;return ks.sort((a,b)=>c[b]-c[a])[0]}
function pickQuest(pool,avoid){
  let cand=pool.filter(q=>!avoid.includes(q.id));if(!cand.length)cand=pool;if(!cand.length)return null;
  if(Math.random()<.7){const ft=topTag();if(ft){const fp=cand.filter(q=>q.tag===ft);if(fp.length)cand=fp}}
  return cand[Math.floor(Math.random()*cand.length)];
}
function ensureQuestBoards(){
  const Q=S.quests,td=new Date().toDateString();
  if(Q.dailyDate!==td){Q.dailyDate=td;const pool=QUESTS.filter(q=>q.cat==='daily');Q.dailyIds=[];
    for(let i=0;i<3;i++){const p=pickQuest(pool,Q.dailyIds.concat(Q.recentDaily));if(p)Q.dailyIds.push(p.id)}
    Q.recentDaily=Q.dailyIds.slice();}
  const d=new Date(),day=(d.getDay()+6)%7,mon=new Date(d);mon.setHours(0,0,0,0);mon.setDate(d.getDate()-day);const wk=mon.toDateString();
  if(Q.weeklyDate!==wk){Q.weeklyDate=wk;const pool=QUESTS.filter(q=>q.cat==='weekly');Q.weeklyIds=[];
    for(let i=0;i<2;i++){const p=pickQuest(pool,Q.weeklyIds.concat(Q.recentWeekly));if(p)Q.weeklyIds.push(p.id)}
    Q.recentWeekly=Q.weeklyIds.slice();}
  Q.boardIds=Q.boardIds||[];
  const pool=QUESTS.filter(q=>['discovery','skill','social','hidden'].includes(q.cat));
  let guard=0;
  while(Q.boardIds.length<6&&guard++<20){const avoid=Q.boardIds.concat(Q.active.map(a=>a.qid)).concat(Q.log.slice(0,10).map(l=>l.qid));
    const p=pickQuest(pool,avoid);if(!p)break;Q.boardIds.push(p.id)}
  save();
}
function nextMidnight(){const d=new Date();d.setHours(24,0,0,0);return d.getTime()-Date.now()}
function nextWeekReset(){const d=new Date(),day=(d.getDay()+6)%7,r=new Date(d);r.setHours(24,0,0,0);r.setDate(d.getDate()+(7-day));return r.getTime()-Date.now()}
function fmtCountdown(ms){if(ms<0)ms=0;return Math.floor(ms/3600000)+'h '+Math.floor(ms%3600000/60000)+'m'}
function acceptQuest(qid){
  if(S.quests.active.find(a=>a.qid===qid))return;
  S.quests.active.push({qid,ts:Date.now()});
  if(S.quests.boardIds.includes(qid)){S.quests.boardIds=S.quests.boardIds.filter(x=>x!==qid);ensureQuestBoards()}
  save();toast('Quest accepted: '+QUESTS_BY[qid].name);renderQuests();
}
function skipOffer(qid){
  const Q=S.quests;
  if(Q.dailyIds.includes(qid)){const pool=QUESTS.filter(q=>q.cat==='daily');const p=pickQuest(pool,Q.dailyIds.concat(Q.recentDaily))||pickQuest(pool,[]);
    Q.dailyIds=Q.dailyIds.map(id=>id===qid?p.id:id);Q.recentDaily=Q.recentDaily.concat(p.id).slice(-8);}
  else if(Q.weeklyIds.includes(qid)){const pool=QUESTS.filter(q=>q.cat==='weekly');const p=pickQuest(pool,Q.weeklyIds.concat(Q.recentWeekly))||pickQuest(pool,[]);
    Q.weeklyIds=Q.weeklyIds.map(id=>id===qid?p.id:id);Q.recentWeekly=Q.recentWeekly.concat(p.id).slice(-6);}
  else{Q.boardIds=Q.boardIds.filter(x=>x!==qid);ensureQuestBoards();}
  save();renderQuests();
}
function dropQuest(qid){S.quests.active=S.quests.active.filter(a=>a.qid!==qid);save();renderQuests()}
function completeQuest(qid){
  const idx=S.quests.active.findIndex(a=>a.qid===qid);if(idx<0)return;
  const q=QUESTS_BY[qid],old=totalXP();
  S.quests.active.splice(idx,1);S.qxp+=q.xp;S.coins+=q.coins;
  S.quests.log.unshift({qid,t:Date.now(),xp:q.xp,coins:q.coins,cat:q.cat});if(S.quests.log.length>300)S.quests.log.length=300;
  const nw=totalXP();S.feed.unshift({q:qid,t:Date.now()});
  if(lvOf(nw)>lvOf(old))S.feed.unshift({lv:lvOf(nw),t:Date.now()});
  save();
  const cm=CATMETA[q.cat];
  queuePop({icon:q.secret?'❓':cm.icon,title:q.name,desc:q.desc,xp:q.xp,coins:q.coins,rc:cm.c,rn:cm.label},old,nw);
  if(q.ach&&!S.done[q.ach])unlock(q.ach);
  checkMilestones();ensureQuestBoards();refresh();
}
function qCard(q,state){
  const meta=CATMETA[q.cat],hd=q.secret&&state==='offer';
  return`<div class="qcard"><div class="meta"><span class="tag">${meta.icon} ${meta.label}</span><span class="tag">${q.diff}</span></div>
  <h3>${hd?'Hidden Quest':esc(q.name)}</h3><div class="d">${hd?'Accept to reveal what this one is.':esc(q.desc)}</div>
  <div class="meta"><span class="tag">+${q.xp} XP</span><span class="tag">+${q.coins} 🪙</span><span class="tag">${q.time}</span></div>
  <div class="act">${state==='offer'?`<button class="btn" data-acc="${q.id}">Accept</button><button class="btn dark" data-skip="${q.id}">Skip</button>`:`<button class="btn" data-comp="${q.id}">Complete</button><button class="link" data-drop="${q.id}">Drop</button>`}</div></div>`;
}
function renderQuests(){
  ensureQuestBoards();
  const Q=S.quests,el=$('#qp');
  const dailyOffers=Q.dailyIds.filter(id=>!Q.active.find(a=>a.qid===id)).map(id=>QUESTS_BY[id]);
  const weeklyOffers=Q.weeklyIds.filter(id=>!Q.active.find(a=>a.qid===id)).map(id=>QUESTS_BY[id]);
  const boardOffers=Q.boardIds.map(id=>QUESTS_BY[id]);
  const active=Q.active.map(a=>QUESTS_BY[a.qid]).filter(Boolean);
  const log=Q.log,byCat={};log.forEach(l=>byCat[l.cat]=(byCat[l.cat]||0)+1);
  const favCat=Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a])[0];
  const totXP=log.reduce((s,l)=>s+l.xp,0),totCoin=log.reduce((s,l)=>s+l.coins,0);
  el.innerHTML=`<h1>Quests</h1><p class="muted">Suggested things to actually go and do. Accept what sounds fun, skip what doesn't — nothing here costs you XP or coins.</p>
  <div class="panel"><b>Active quests</b>${active.length?active.map(q=>qCard(q,'active')).join(''):'<p class="small">Nothing active yet. Accept a quest below.</p>'}</div>
  <div class="panel"><b>Daily Quests</b><span class="qtimer"> · resets in ${fmtCountdown(nextMidnight())}</span><div class="qgrid">${dailyOffers.map(q=>qCard(q,'offer')).join('')||'<p class="small">All accepted. Check back tomorrow for more.</p>'}</div></div>
  <div class="panel"><b>Weekly Quest</b><span class="qtimer"> · resets in ${Math.max(1,Math.ceil(nextWeekReset()/86400000))} day(s)</span><div class="qgrid">${weeklyOffers.map(q=>qCard(q,'offer')).join('')||'<p class="small">All accepted for this week.</p>'}</div></div>
  <div class="panel"><b>Explore</b><p class="small">Discovery, Skill and Social quests, with the occasional Hidden one. Skip a card and a new one takes its place.</p><div class="qgrid">${boardOffers.map(q=>qCard(q,'offer')).join('')}</div></div>
  <div class="panel"><b>Quest history</b><p class="small">${log.length} completed · ${totXP} XP earned · ${totCoin} 🪙 earned${favCat?' · favourite type: '+CATMETA[favCat].label:''}</p>
  ${log.slice(0,10).map(l=>{const q=QUESTS_BY[l.qid];return q?`<div class="small">${CATMETA[l.cat].icon} ${esc(q.name)} — +${l.xp} XP, +${l.coins} 🪙 — ${ago(l.t)}</div>`:''}).join('')||'<p class="small">No quests completed yet.</p>'}</div>`;
}
$('#qp').addEventListener('click',e=>{
  const a=e.target.closest('[data-acc]');if(a)return acceptQuest(a.dataset.acc);
  const s=e.target.closest('[data-skip]');if(s)return skipOffer(s.dataset.skip);
  const c=e.target.closest('[data-comp]');if(c)return completeQuest(c.dataset.comp);
  const d=e.target.closest('[data-drop]');if(d)return dropQuest(d.dataset.drop);
});

/* ---------- PROFILE ---------- */
function renderMe(){
  const xp=totalXP(),L=lvOf(xp),done=A.filter(isDone),privs=done.filter(a=>S.priv[a.id]);
  const skills=TABS.map(t=>{const x=t.nodes.filter(isDone).reduce((s,a)=>s+a.xp,0),l=Math.floor(Math.sqrt(x/10)),nx=10*(l+1)**2,pv=10*l*l;
    return`<div class="skill"><span>${t.icon} ${t.name}</span><div class="pbar"><i style="width:${(x-pv)/(nx-pv)*100}%"></i></div><span>Lv ${l}</span></div>`}).join('');
  const tally=Object.keys(RAR).map(k=>`<span class="tag" style="color:${RAR[k].c};border-color:${RAR[k].c}">${RAR[k].n}: ${done.filter(a=>a.r===k).length}</span>`).join('');
  $('#mp').innerHTML=`<h1>Profile</h1>
  <div class="panel ev"><div class="av" style="background:#9bc56a;width:64px;height:64px;font-size:28px">${esc(S.name[0]||'?').toUpperCase()}</div><div class="b">
  <input class="in" id="nm" value="${esc(S.name)}" maxlength="20" aria-label="Display name" style="width:100%;max-width:240px"><div style="margin:8px 0 4px">Level ${L}, ${titleOf(L)}</div>
  <div class="pbar"><i style="width:${frac(xp,L)}%"></i></div><div class="small">${xp} XP · ${cum(L+1)-xp} to Level ${L+1} · ${done.length} of ${A.length} unlocked</div></div></div>
  <div class="panel"><b>Skills</b><p class="small">Each skill levels up from the achievements in its branch.</p>${skills}<div style="margin-top:12px">${tally}</div></div>
  <div class="panel"><b>Privacy</b><label class="chk"><input type="checkbox" id="shr" ${S.share?'checked':''}> Show my unlocks and level-ups to friends</label>
  <p class="small">You can also keep any single achievement private from its detail panel on the map.</p>
  ${privs.length?privs.map(a=>`<span class="tag">${a.icon} ${esc(a.title)} <button class="link" data-pub="${a.id}">make public</button></span>`).join(''):'<p class="small">No private achievements.</p>'}</div>
  <div class="panel"><b>Your data</b><p class="small">Progress is saved in this browser only.</p><button class="btn gray" id="rst">Reset all progress</button></div>`;
}
$('#mp').addEventListener('input',e=>{if(e.target.id==='nm'){S.name=e.target.value.trim()||'Player One';save()}});
$('#mp').addEventListener('change',e=>{if(e.target.id==='shr'){S.share=e.target.checked;save()}});
$('#mp').addEventListener('click',e=>{
  const p=e.target.closest('[data-pub]');if(p){delete S.priv[p.dataset.pub];save();renderMe();return}
  if(e.target.id==='rst'&&confirm('Reset all progress? This cannot be undone.')){S.done={};S.priv={};S.ny=[];S.sk=[];S.feed=[];S.rx={};S.cm={};S.qcN=0;S.qcY=0;save();closeDetail();refresh()}
});

/* ---------- NAV ---------- */
function header(){const xp=totalXP(),L=lvOf(xp);$('#lv').textContent='Lv '+L;$('#hb').style.width=frac(xp,L)+'%';$('#hx').textContent=xp+' XP'}
function go(v){S.view=v;save();document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(v==='map'){drawMap();if(!go.fitted){fit();go.fitted=1}}
  if(v==='qc')renderQC(!qcCur);if(v==='feed')renderFeed();if(v==='me')renderMe()}
function refresh(){header();if(S.view==='map')drawMap();else if(S.view==='qc')renderQC(false);else if(S.view==='feed')renderFeed();else renderMe();
  if(selId&&$('#det').classList.contains('on'))openDetail(selId)}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b){closeDetail();go(b.dataset.v)}});
addEventListener('resize',()=>{if(S.view==='map')applyV()});
header();go(S.view);
</script>
</body>
</html>
